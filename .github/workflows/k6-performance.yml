name: k6 Performance Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  k6-tests:
    name: k6 ${{ matrix.test_name }} test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - test_name: load
            script: tests/performance/k6-load.js
          - test_name: stress
            script: tests/performance/k6-stress.js
          - test_name: spike
            script: tests/performance/k6-spike.js

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Install dependencies
        run: npm ci

      - name: Validate k6 cloud token
        env:
          K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
        run: |
          if [ -z "$K6_CLOUD_TOKEN" ]; then
            echo "Missing required GitHub secret: K6_CLOUD_TOKEN"
            exit 1
          fi

      - name: Start API server
        run: |
          npm run api > api.log 2>&1 &
          echo $! > api.pid

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:3000/api/health" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "API did not start in time"
          cat api.log || true
          exit 1

      - name: Run k6 ${{ matrix.test_name }} test
        env:
          K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
        run: |
          mkdir -p k6-results
          k6 cloud "${{ matrix.script }}" 2>&1 | tee "k6-results/${{ matrix.test_name }}.log"

      - name: Add k6 cloud link to summary
        if: ${{ always() }}
        run: |
          log_file="k6-results/${{ matrix.test_name }}.log"
          run_url=$(grep -Eo 'https://app\.k6\.io/runs/[0-9]+' "$log_file" | head -n1 || true)
          if [ -z "$run_url" ]; then
            run_url=$(grep -Eo 'https://app\.grafana\.com/a/k6-app/runs/[A-Za-z0-9_-]+' "$log_file" | head -n1 || true)
          fi
          if [ -z "$run_url" ]; then
            run_url=$(grep -Eo 'https://[^ ]+/runs/[A-Za-z0-9_-]+' "$log_file" | head -n1 || true)
          fi

          if [ -n "$run_url" ]; then
            echo "Discovered k6 cloud run URL: $run_url"
            echo "## k6 ${{ matrix.test_name }} test" >> "$GITHUB_STEP_SUMMARY"
            echo "- [Open run in Grafana Cloud]($run_url)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Could not find run URL in $log_file"
            echo "Last lines of k6 output:"
            tail -n 40 "$log_file" || true
            echo "## k6 ${{ matrix.test_name }} test" >> "$GITHUB_STEP_SUMMARY"
            echo "- Run URL not found in logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stop API server
        if: ${{ always() }}
        run: |
          if [ -f api.pid ]; then
            kill "$(cat api.pid)" || true
          fi

      - name: Upload k6 artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: k6-${{ matrix.test_name }}-results
          path: |
            k6-results/
            api.log
          retention-days: 14
