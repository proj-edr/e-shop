name: k6 Performance Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  k6-tests:
    name: k6 ${{ matrix.test_name }} test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PERF_BLOCKING: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - test_name: load
            script: tests/performance/k6-load.js
          - test_name: stress
            script: tests/performance/k6-stress.js
          - test_name: spike
            script: tests/performance/k6-spike.js

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Install dependencies
        run: npm ci

      - name: Validate k6 cloud token
        env:
          K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
        run: |
          if [ -z "$K6_CLOUD_TOKEN" ]; then
            echo "Missing required GitHub secret: K6_CLOUD_TOKEN"
            exit 1
          fi

      - name: Start API server
        run: |
          npm run api > api.log 2>&1 &
          echo $! > api.pid

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:3000/api/health" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "API did not start in time"
          cat api.log || true
          exit 1

      - name: Run k6 ${{ matrix.test_name }} test
        env:
          K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
        run: |
          mkdir -p k6-results
          log_file="k6-results/${{ matrix.test_name }}.log"
          set +e
          k6 run -o cloud "${{ matrix.script }}" 2>&1 | tee "$log_file"
          k6_exit=$?
          set -e

          if ! grep -qiE 'execution:\s*cloud|output:\s*cloud|app\.k6\.io|app\.grafana\.com' "$log_file"; then
            echo "k6 did not appear to run in cloud mode. Check token/account setup."
            tail -n 60 "$log_file" || true
            exit 1
          fi

          echo "$k6_exit" > "k6-results/${{ matrix.test_name }}.exitcode"
          if [ "$k6_exit" -ne 0 ]; then
            if [ "$PERF_BLOCKING" = "true" ]; then
              echo "k6 failed and PERF_BLOCKING=true, failing workflow."
              exit "$k6_exit"
            else
              echo "k6 failed but PERF_BLOCKING=false, continuing (PR mode)."
            fi
          fi

      - name: Add k6 cloud link to summary
        if: ${{ always() }}
        env:
          GRAFANA_K6_RUNS_PAGE_URL: ${{ vars.GRAFANA_K6_RUNS_PAGE_URL }}
        run: |
          log_file="k6-results/${{ matrix.test_name }}.log"
          exit_code_file="k6-results/${{ matrix.test_name }}.exitcode"
          k6_exit_code="unknown"
          if [ -f "$exit_code_file" ]; then
            k6_exit_code=$(cat "$exit_code_file")
          fi
          clean_log="k6-results/${{ matrix.test_name }}.clean.log"
          perl -pe 's/\e\[[0-9;]*[A-Za-z]//g; s/\e]8;;[^\e]*\e\\//g; s/\e]8;;\e\\//g' "$log_file" > "$clean_log"
          run_url=$(grep -Eo 'https://app\.k6\.io/runs/[0-9]+' "$clean_log" | head -n1 || true)
          if [ -z "$run_url" ]; then
            run_url=$(grep -Eo 'https://[^ ]+/a/k6-app/runs/[A-Za-z0-9_-]+' "$clean_log" | head -n1 || true)
          fi
          if [ -z "$run_url" ]; then
            run_url=$(grep -Eo 'https://[^ ]+/runs/[A-Za-z0-9_-]+' "$clean_log" | head -n1 || true)
          fi
          if [ -z "$run_url" ]; then
            run_id=$(grep -Eio '(run|test)[[:space:]_-]*(id|identifier)[^0-9]*[0-9]+' "$clean_log" | grep -Eo '[0-9]+' | head -n1 || true)
            if [ -n "$run_id" ]; then
              run_url="https://app.k6.io/runs/$run_id"
            fi
          fi
          runs_page_url="${GRAFANA_K6_RUNS_PAGE_URL:-https://app.k6.io/runs}"

          if [ -n "$run_url" ]; then
            echo "Discovered k6 cloud run URL: $run_url"
            echo "## k6 ${{ matrix.test_name }} test" >> "$GITHUB_STEP_SUMMARY"
            echo "- [Open run in Grafana Cloud]($run_url)" >> "$GITHUB_STEP_SUMMARY"
            echo "- [Open all runs]($runs_page_url)" >> "$GITHUB_STEP_SUMMARY"
            echo "- k6 exit code: \`$k6_exit_code\` (PERF_BLOCKING=\`$PERF_BLOCKING\`)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Could not find run URL in $log_file"
            echo "Last lines of k6 output:"
            tail -n 40 "$clean_log" || true
            echo "## k6 ${{ matrix.test_name }} test" >> "$GITHUB_STEP_SUMMARY"
            echo "- Run URL not found in logs." >> "$GITHUB_STEP_SUMMARY"
            echo "- [Open all runs]($runs_page_url)" >> "$GITHUB_STEP_SUMMARY"
            echo "- k6 exit code: \`$k6_exit_code\` (PERF_BLOCKING=\`$PERF_BLOCKING\`)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stop API server
        if: ${{ always() }}
        run: |
          if [ -f api.pid ]; then
            kill "$(cat api.pid)" || true
          fi

      - name: Upload k6 artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: k6-${{ matrix.test_name }}-results
          path: |
            k6-results/
            api.log
          retention-days: 14
